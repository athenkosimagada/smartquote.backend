name: Smart Quote CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  DOTNET_VERSION: '9.x'
  SOLUTION_PATH: 'smartquote.sln'
  API_PROJECT_PATH: 'smartquote.api'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      - name: Test
        run: dotnet test ${{ env.SOLUTION_PATH }} --configuration Release --no-restore --no-build --verbosity normal
  
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [build-and-test]
    container: ghcr.io/railwayapp/cli:latest
    env:
     RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
     SVC_ID: ${{ secrets.SVC_ID }}
     JwtSettings__SecretKey: ${{ secrets.JWT_SECRET_KEY }}
     JwtSettings__Issuer: ${{ secrets.JWT_ISSUER }}
     JwtSettings__Audience: ${{ secrets.JWT_AUDIENCE }}
     JwtSettings__ExpirationMinutes: ${{ secrets.JWT_EXPIRATION_MINUTES }}
     ConnectionStrings__DefaultConnection: ${{ secrets.DB_CONNECTION_STRING }}
    steps:
    - run: railway up --service ${{ env.SVC_ID }}

