name: Smart Quote - Quotes Management CI

on:
  workflow_dispatch:
  push:
    branches:
      - feature/quote-management

env:
  DOTNET_VERSION: '9.x'
  SOLUTION_PATH: 'smartquote.sln'
  API_PROJECT_PATH: 'smartquote.api'

jobs:
  build-and-test:
    name: Build and Test Quotes Management
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      - name: Test
        run: dotnet test ${{ env.SOLUTION_PATH }} --configuration Release --no-restore --verbosity normal
